<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#1c1c1e">
<title>Paris Walk</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
:root { --bg:#ffffff; --fg:#1d1d1f; --muted:#6e6e73; --card:#ffffffee; --line:#e5e5ea; --hl:#f2f2f7;
        --accent:#e6194b; --ok:#2e9e44; --warn:#d97706; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg:#1c1c1e; --fg:#f2f2f7; --muted:#a1a1a6; --card:#1c1c1eee;
        --line:#38383a; --hl:#2c2c2e; }
}
:root[data-theme="dark"] { --bg:#1c1c1e; --fg:#f2f2f7; --muted:#a1a1a6; --card:#1c1c1eee; --line:#38383a; --hl:#2c2c2e; }
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { margin:0; height:100%; background:var(--bg); color:var(--fg); overflow:hidden;
  font:15px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
#map { position:absolute; inset:0; }
.card { position:absolute; left:10px; right:10px; background:var(--card); backdrop-filter:blur(8px);
  border-radius:14px; box-shadow:0 2px 12px #0003; z-index:1000; }
#guide { top:calc(10px + env(safe-area-inset-top)); display:flex; gap:12px; align-items:center; padding:10px 14px; }
#gicon { width:52px; height:52px; flex:none; border-radius:12px; background:var(--accent); color:#fff;
  display:grid; place-items:center; font-size:30px; font-weight:700; transition:background .2s; }
#gicon.uturn { background:var(--warn); }
#gicon.off { background:#555; }
#gtext { min-width:0; flex:1; }
#gdist { font-size:24px; font-weight:700; font-variant-numeric:tabular-nums; }
#gwhat { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
#gnow { color:var(--muted); font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
#bar { bottom:calc(10px + env(safe-area-inset-bottom)); padding:10px 12px; }
#prog { height:6px; background:var(--hl); border-radius:3px; overflow:hidden; margin:6px 0 10px; }
#prog i { display:block; height:100%; width:0; background:var(--ok); }
#binfo { display:flex; justify-content:space-between; font-size:13px; color:var(--muted); gap:8px; }
#binfo b { color:var(--fg); }
#btns { display:flex; gap:8px; }
button { font:inherit; border:none; border-radius:10px; padding:10px 12px; background:var(--hl); color:var(--fg);
  cursor:pointer; }
button.primary { flex:1; background:var(--accent); color:#fff; font-weight:600; }
button.on { outline:2px solid var(--accent); }
#recenter { position:absolute; right:10px; z-index:1000; bottom:150px; width:44px; height:44px; padding:0;
  border-radius:22px; box-shadow:0 2px 8px #0003; background:var(--card); font-size:20px; }
#panel { position:absolute; inset:0; z-index:2000; background:var(--bg); display:none; flex-direction:column; }
#panel.open { display:flex; }
#panel header { display:flex; align-items:center; gap:10px; padding:calc(12px + env(safe-area-inset-top)) 14px 10px;
  border-bottom:1px solid var(--line); }
#panel h1 { font-size:18px; margin:0; flex:1; }
#total { padding:10px 14px; color:var(--muted); font-size:13px; border-bottom:1px solid var(--line); }
#list { overflow:auto; flex:1; }
.st { display:flex; gap:10px; align-items:center; padding:10px 14px; border-bottom:1px solid var(--line); cursor:pointer; }
.st:active, .st.cur { background:var(--hl); }
.sw { width:10px; height:10px; border-radius:50%; flex:none; }
.st .t { flex:1; min-width:0; }
.st .t div { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.st small { color:var(--muted); }
.pill { font-size:12px; padding:2px 8px; border-radius:10px; background:var(--hl); color:var(--muted); white-space:nowrap; }
.pill.done { background:var(--ok); color:#fff; }
#sim { display:none; gap:6px; margin-top:8px; align-items:center; font-size:13px; color:var(--muted); }
#sim.show { display:flex; }
#sim button { padding:6px 10px; }
.arrow { color:#fff; font-size:13px; line-height:16px; text-align:center; text-shadow:0 0 2px #000, 0 0 2px #000; }
.me { width:18px; height:18px; border-radius:50%; background:#1a73e8; border:3px solid #fff; box-shadow:0 0 0 1px #0004, 0 0 10px #1a73e8; }
#toast { position:absolute; left:50%; top:120px; transform:translateX(-50%); z-index:3000; background:#000c; color:#fff;
  padding:8px 14px; border-radius:20px; font-size:14px; display:none; }
</style>
</head>
<body>
<div id="map"></div>

<div id="guide" class="card">
  <div id="gicon">↑</div>
  <div id="gtext">
    <div id="gdist">Pick a stage</div>
    <div id="gwhat"></div>
    <div id="gnow"></div>
  </div>
</div>

<button id="recenter" title="Follow my position">◎</button>

<div id="bar" class="card">
  <div id="binfo"><span id="bstage">—</span><span id="bkm"></span></div>
  <div id="prog"><i></i></div>
  <div id="btns">
    <button id="bstages">Stages</button>
    <button id="bgo" class="primary">Start</button>
    <button id="bmore" title="More">⋯</button>
  </div>
  <div id="sim">
    Simulate walk:
    <button data-x="0">Off</button><button data-x="1">×1</button><button data-x="10">×10</button><button data-x="40">×40</button>
    <button id="relocate">Re-locate</button>
  </div>
</div>

<div id="panel">
  <header><h1>Stages</h1><button id="pclose">Close</button></header>
  <div id="total"></div>
  <div id="list"></div>
</div>
<div id="toast"></div>

<script src="app.js"></script>
</body>
</html>
